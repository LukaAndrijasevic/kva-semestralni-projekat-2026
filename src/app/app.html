<mat-toolbar color="primary">

    <span>
        <strong>Svet igracaka</strong>
    </span>
    <span class="spacer"></span>

    <a routerLink="/" matButton     >Pocetna</a>
    <a routerLink="/about" matButton>O nama</a>

    @if(authService.getActiveUser()) {
        <button matButton [matMenuTriggerFor]="korisnikMeni">
            <mat-icon fontIcon="person" /> {{authService.getActiveUser()?.firstName}}
        </button>

        <mat-menu #korisnikMeni="matMenu" xPosition="after">
            <button mat-menu-item (click)="doLogout()">
                <mat-icon fontIcon="logout" /> Odjava
            </button>
        </mat-menu>
    }
    @else {
        <a routerLink="/login" matButton>
            <mat-icon fontIcon="login" /> Prijava
        </a>
    }

</mat-toolbar>

<div class="wrapper">
    <router-outlet />
</div>

<footer class="text-center">
    &copy; {{year}} Univerzitet Singidunum - Tehnicki Fakultet - KVA
</footer>
